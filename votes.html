<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Votes · Sunday Scaries</title>
<link rel="stylesheet" href="styles.css"/>
<style>
select, button { font: inherit; }
select { width: 100%; min-height: 44px; padding: 8px; background: #fbf8ef; border: 1px solid #ddd4bf; }
fieldset.vote { border: 1px solid #ddd4bf; margin: 16px 0; padding: 16px; background: #fbf8ef; }
label.choice { display: flex; gap: 10px; align-items: flex-start; min-height: 44px; padding: 8px 0; }
label.choice input { margin-top: 4px; }
#ballot .btn { margin-top: 12px; border: 0; cursor: pointer; }
</style>
</head>
<body>
<header id="site-header"></header>
<main class="doc">
<p class="kicker">Founding votes · 2026</p>
<h1>Votes</h1>
<p>Eight managers. One ballot each. Cast it here before the first nomination. Nothing is law until it is on this tally.</p>
<form id="ballot"></form>
<section id="results" style="margin-top:36px"></section>
</main>
<footer id="site-footer"></footer>
<script src="js/league.js"></script>
<script src="js/site.js"></script>
<script src="js/votes.js"></script>
</body>
</html>
